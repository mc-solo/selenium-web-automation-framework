[browser]
# headless Chrome is the default. Set headless=false to watch a run locally.
headless = true
window_width = 1920
window_height = 1080
implicit_wait = 0
explicit_wait = 10
page_load_timeout = 30

[urls]
saucedemo = https://www.saucedemo.com
todomvc = https://demo.playwright.dev/todomvc

[saucedemo]
# Public demo credentials shown on the SauceDemo login page itself.
standard_user = standard_user
locked_out_user = locked_out_user
password = secret_sauce
